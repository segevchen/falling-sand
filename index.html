<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling Sand</title>
<style>
  :root {
    --bg: #0b0b12;
    --panel: #161622;
    --text: #e8e8f0;
    --muted: #8a8aa0;
    --accent: #ffcc55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 12px 16px; gap: 10px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center;
    background: var(--panel); padding: 8px; border-radius: 10px; max-width: 100%; }
  .tool { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 7px;
    border: 2px solid transparent; background: #20202e; color: var(--text); cursor: pointer;
    font-size: 14px; user-select: none; }
  .tool:hover { background: #2a2a3c; }
  .tool.active { border-color: var(--accent); background: #2a2a3c; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; }
  .key { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
    font-size: 14px; color: var(--muted); }
  .controls button { padding: 6px 12px; border-radius: 7px; border: none; background: #20202e;
    color: var(--text); cursor: pointer; font-size: 14px; }
  .controls button:hover { background: #2a2a3c; }
  .stage { position: relative; width: 100%; max-width: min(1100px, calc((100vh - 190px) * 1.6));
    aspect-ratio: 8 / 5; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #2a2a3c; background: var(--bg); }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; color: var(--muted); font-size: 18px; transition: opacity .6s; text-align: center; padding: 16px; line-height: 1.5; }
  .hint.gone { opacity: 0; }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 20px); opacity: 0;
    background: #2a2a3c; color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 14px;
    pointer-events: none; transition: opacity .3s, transform .3s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #windLabel { display: inline-block; min-width: 4.5em; color: var(--text); }
</style>
</head>
<body>
  <h1>Falling <span>Sand</span></h1>
  <div class="toolbar" id="toolbar"></div>
  <div class="controls">
    <label>Brush <input type="range" id="brush" min="1" max="15" value="4"></label>
    <button id="pause">Pause (Space)</button>
    <button id="clear">Clear (C)</button>
    <label title="Arrow keys also change the wind; double-click to calm it">Wind <input type="range" id="wind" min="-100" max="100" value="0" step="10"></label>
    <span id="windLabel">calm</span>
    <button id="pause">Pause (Space)</button>
    <button id="clear">Clear (C)</button>
    <button id="mute">Sound on (M)</button>
    <button id="share">Share link</button>
    <span id="count">0 particles</span>
  </div>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="hint" id="hint">Pick an element and draw. Right-click erases.<br>Try lava on water, gunpowder and a spark,<br>or drop some critters and strike them with lightning.</div>
    <div class="toast" id="toast"></div>
  </div>

<script>
const W = 320, H = 200, S = 3; // simulation grid, display scale

// Element ids
const EMPTY = 0, WALL = 1, SAND = 2, WATER = 3, FIRE = 4, PLANT = 5, LAVA = 6, STONE = 7,
      STEAM = 8, SMOKE = 9, OIL = 10, GUNPOWDER = 11, ACID = 12, ICE = 13, GLASS = 14;
// Tools that aren't elements
const LIGHTNING = 100, CRITTER = 101;

// Density decides who sinks through whom; non-movable elements never get displaced
const DENS = new Float32Array(16);
DENS[FIRE] = 0.1; DENS[SMOKE] = 0.1; DENS[STEAM] = 0.1;
DENS[OIL] = 1; DENS[WATER] = 2; DENS[ACID] = 2.2; DENS[LAVA] = 3;
DENS[SAND] = 4; DENS[GUNPOWDER] = 4; DENS[STONE] = 5;
DENS[WALL] = 99; DENS[PLANT] = 99; DENS[ICE] = 99; DENS[GLASS] = 99;
const MOVABLE = new Uint8Array(16);
for (const t of [FIRE, SMOKE, STEAM, OIL, WATER, ACID, LAVA, SAND, GUNPOWDER, STONE]) MOVABLE[t] = 1;

const TOOLS = [
  { name: 'Sand',      t: SAND,      key: '1', color: '#e6c36e' },
  { name: 'Water',     t: WATER,     key: '2', color: '#2f72e6' },
  { name: 'Fire',      t: FIRE,      key: '3', color: '#ff7a1a' },
  { name: 'Plant',     t: PLANT,     key: '4', color: '#2fae48' },
  { name: 'Lava',      t: LAVA,      key: '5', color: '#f0561a' },
  { name: 'Oil',       t: OIL,       key: '6', color: '#5a3c1e' },
  { name: 'Gunpowder', t: GUNPOWDER, key: '7', color: '#4a4a50' },
  { name: 'Acid',      t: ACID,      key: '8', color: '#7cf03c' },
  { name: 'Ice',       t: ICE,       key: '9', color: '#b0dcff' },
  { name: 'Lightning', t: LIGHTNING, key: 'l', color: '#dfe6ff' },
  { name: 'Critter',   t: CRITTER,   key: 'r', color: '#ff8fc8' },
  { name: 'Stone',     t: STONE,     key: '0', color: '#6e6e76' },
  { name: 'Wall',      t: WALL,      key: 'w', color: '#9a9aa8' },
  { name: 'Erase',     t: EMPTY,     key: 'e', color: '#0b0b12' },
];

const type = new Uint8Array(W * H);
const life = new Uint8Array(W * H);
const shade = new Uint8Array(W * H);
const stepped = new Uint8Array(W * H);
let tick = 1;

// Events collected during a step, turned into sound and shake by the main loop
let booms = 0, sizzles = 0, thunders = 0, squeaks = 0, shake = 0, flash = 0;
let wind = 0; // -0.8 .. 0.8: chance per step that a gas or falling grain is pushed sideways

function initialLife(t) {
  if (t === FIRE) return 20 + (Math.random() * 35) | 0;
  if (t === STEAM) return 120 + (Math.random() * 120) | 0;
  if (t === SMOKE) return 30 + (Math.random() * 50) | 0;
  return 0;
}

function make(i, t) {
  type[i] = t;
  life[i] = initialLife(t);
  shade[i] = (Math.random() * 255) | 0;
  stepped[i] = tick;
}

function swap(i, j) {
  let a = type[i]; type[i] = type[j]; type[j] = a;
  a = life[i]; life[i] = life[j]; life[j] = a;
  a = shade[i]; shade[i] = shade[j]; shade[j] = a;
  stepped[i] = tick; stepped[j] = tick;
}

function canEnter(x, y, t) {
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  const tt = type[y * W + x];
  return tt === EMPTY || (MOVABLE[tt] && DENS[tt] < DENS[t]);
}

function tryMove(i, x, y, t) {
  if (!canEnter(x, y, t)) return false;
  swap(i, y * W + x);
  return true;
}

function tryRise(i, x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return false;
  const j = y * W + x;
  if (type[j] !== EMPTY) return false;
  swap(i, j);
  return true;
}

const DX = [0, 1, 0, -1], DY = [1, 0, -1, 0];

// Index of a random 4-neighbour, or -1 if it falls off the grid
function randomNeighbor(x, y) {
  const k = (Math.random() * 4) | 0;
  const nx = x + DX[k], ny = y + DY[k];
  return nx < 0 || nx >= W || ny < 0 || ny >= H ? -1 : ny * W + nx;
}

// Wind blows falling grains and droplets sideways while they are in the air
function drift(i, x, y, t) {
  if (!wind || y + 1 >= H || type[i + W] !== EMPTY || Math.random() > Math.abs(wind) * 0.6) return false;
  return tryMove(i, x + (wind > 0 ? 1 : -1), y + 1, t);
}

function powder(i, x, y, t) {
  if (drift(i, x, y, t)) return;
  if (tryMove(i, x, y + 1, t)) return;
  const d = Math.random() < 0.5 ? 1 : -1;
  if (tryMove(i, x + d, y + 1, t)) return;
  tryMove(i, x - d, y + 1, t);
}

function liquid(i, x, y, t, spread) {
  if (drift(i, x, y, t)) return;
  if (tryMove(i, x, y + 1, t)) return;
  const d = Math.random() < 0.5 ? 1 : -1;
  if (tryMove(i, x + d, y + 1, t)) return;
  if (tryMove(i, x - d, y + 1, t)) return;
  for (const dir of [d, -d]) {
    let best = -1;
    for (let s = 1; s <= spread; s++) {
      if (!canEnter(x + dir * s, y, t)) break;
      best = x + dir * s;
    }
    if (best >= 0) { swap(i, y * W + best); return; }
  }
}

function gas(i, x, y) {
  if (wind && Math.random() < Math.abs(wind)) {
    const w = wind > 0 ? 1 : -1;
    if (tryRise(i, x + w, y - 1) || tryRise(i, x + w, y)) return;
  }
  const d = Math.random() < 0.5 ? 1 : -1;
  if (tryRise(i, x, y - 1)) return;
  if (tryRise(i, x + d, y - 1)) return;
  if (tryRise(i, x - d, y - 1)) return;
  tryRise(i, x + d, y);
}

function explode(cx, cy) {
  const r = 7 + ((Math.random() * 5) | 0);
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      const d2 = dx * dx + dy * dy;
      if (d2 > r * r) continue;
      const x = cx + dx, y = cy + dy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x;
      if (type[i] === WALL) continue; // walls survive blasts
      const falloff = Math.sqrt(d2) / r;
      if (Math.random() < 1 - falloff * 0.5) {
        make(i, Math.random() < 0.75 ? FIRE : SMOKE);
        if (type[i] === FIRE) life[i] = 25 + ((Math.random() * 40) | 0);
      }
    }
  }
  booms++;
  shake = Math.min(shake + 5, 16);
}

function update(i, x, y, t) {
  switch (t) {
    case SAND:
    case STONE:
    case GUNPOWDER:
      powder(i, x, y, t);
      break;

    case WATER:
      for (let k = 0; k < 4; k++) {
        const nx = x + DX[k], ny = y + DY[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const n = ny * W + nx, nt = type[n];
        if (nt === FIRE) {
          make(n, STEAM);
          sizzles++;
          if (Math.random() < 0.3) { make(i, STEAM); return; }
        } else if (nt === LAVA) {
          make(n, STONE);
          make(i, STEAM);
          sizzles += 3;
          return;
        }
      }
      liquid(i, x, y, t, 5);
      break;

    case OIL:
      liquid(i, x, y, t, 3);
      break;

    case ACID: {
      const n = randomNeighbor(x, y);
      if (n >= 0) {
        const nt = type[n];
        if (nt !== EMPTY && nt !== WALL && nt !== GLASS && nt !== ACID && nt !== FIRE && nt !== SMOKE && nt !== STEAM
            && Math.random() < 0.15) {
          make(n, Math.random() < 0.4 ? SMOKE : EMPTY);
          sizzles++;
          if (Math.random() < 0.25) { make(i, SMOKE); return; }
        }
      }
      liquid(i, x, y, t, 3);
      break;
    }

    case LAVA: {
      for (let k = 0; k < 4; k++) {
        const nx = x + DX[k], ny = y + DY[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const n = ny * W + nx, nt = type[n];
        if (nt === GUNPOWDER) { explode(nx, ny); return; }
        if ((nt === PLANT || nt === OIL) && Math.random() < 0.2) make(n, FIRE);
        else if (nt === ICE && Math.random() < 0.2) { make(n, WATER); sizzles++; }
      }
      if (y > 0 && type[i - W] === EMPTY && Math.random() < 0.004) make(i - W, Math.random() < 0.5 ? FIRE : SMOKE);
      if (Math.random() < 0.35) liquid(i, x, y, t, 1);
      break;
    }

    case PLANT:
      if (Math.random() < 0.03) {
        const n = randomNeighbor(x, y);
        if (n >= 0 && type[n] === WATER) make(n, PLANT);
      }
      break;

    case ICE:
      if (Math.random() < 0.02) {
        const n = randomNeighbor(x, y);
        if (n >= 0 && type[n] === WATER) make(n, ICE);
      }
      break;

    case FIRE: {
      if (--life[i] === 0) { make(i, Math.random() < 0.25 ? SMOKE : EMPTY); return; }
      for (let k = 0; k < 4; k++) {
        const nx = x + DX[k], ny = y + DY[k];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const n = ny * W + nx, nt = type[n];
        if (nt === GUNPOWDER) { explode(nx, ny); return; }
        if (nt === PLANT && Math.random() < 0.05) make(n, FIRE);
        else if (nt === OIL && Math.random() < 0.3) make(n, FIRE);
        else if (nt === ICE && Math.random() < 0.08) make(n, WATER);
      }
      if (Math.random() < 0.5) {
        let dx = ((Math.random() * 3) | 0) - 1;
        if (wind && Math.random() < Math.abs(wind)) dx = wind > 0 ? 1 : -1;
        tryRise(i, x + dx, y - 1);
      }
      break;
    }

    case STEAM:
      if (--life[i] === 0) { make(i, Math.random() < 0.4 ? WATER : EMPTY); return; }
      if (y === 0 || type[i - W] !== EMPTY) {
        if (Math.random() < 0.004) { make(i, WATER); return; }
      }
      gas(i, x, y);
      break;

    case SMOKE:
      if (--life[i] === 0) { make(i, EMPTY); return; }
      if (Math.random() < 0.7) gas(i, x, y);
      break;
  }
}

function step() {
  tick = (tick % 255) + 1;
  for (let y = H - 1; y >= 0; y--) {
    const ltr = ((y + tick) & 1) === 0;
    for (let k = 0; k < W; k++) {
      const x = ltr ? k : W - 1 - k;
      const i = y * W + x;
      const t = type[i];
      if (t === EMPTY || t === WALL || stepped[i] === tick) continue;
      update(i, x, y, t);
    }
  }
}

// ---------- Lightning ----------
const bolts = []; // { pts, branches, life } in grid cells, drawn for a few frames

function isAiry(t) { return t === EMPTY || t === FIRE || t === SMOKE || t === STEAM; }

function strike(tx) {
  tx = tx | 0;
  let x = Math.max(0, Math.min(W - 1, tx + ((Math.random() * 40) | 0) - 20)), y = 0;
  const pts = [];
  // Jagged walk from the sky toward the clicked column, stopping at the first thing it hits
  while (true) {
    pts.push([x, y]);
    if (y >= H - 1 || !isAiry(type[y * W + x]) || critterAt(x, y)) break;
    y++;
    if (Math.random() < 0.6) x += Math.random() < 0.5 ? -1 : 1;
    if (Math.random() < 0.35) x += Math.sign(tx - x);
    x = Math.max(0, Math.min(W - 1, x));
  }
  const branches = [];
  for (let b = 0; b < 3; b++) {
    const s = pts[(Math.random() * pts.length * 0.8) | 0];
    let bx = s[0], by = s[1];
    const side = Math.random() < 0.5 ? -1 : 1;
    const len = 10 + (Math.random() * 30) | 0;
    for (let k = 0; k < len && by < H - 1; k++) {
      by++;
      if (Math.random() < 0.6) bx += side;
      if (bx < 0 || bx >= W || !isAiry(type[by * W + bx])) break;
      branches.push([bx, by]);
    }
  }
  bolts.push({ pts, branches, life: 12 });
  const [hx, hy] = pts[pts.length - 1];
  zap(hx, hy);
  flash = 1;
  shake = Math.min(shake + 4, 16);
  thunders++;
}

function zap(cx, cy) {
  killCrittersNear(cx, cy, 4);
  const r = 3;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = cx + dx, y = cy + dy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x, t = type[i];
      if (t === SAND) make(i, GLASS);
      else if (t === GUNPOWDER) explode(x, y);
      else if (t === PLANT || t === OIL) make(i, FIRE);
      else if (t === WATER || t === ICE) make(i, STEAM);
      else if (t === EMPTY && Math.random() < 0.3) make(i, FIRE);
    }
  }
  // Lightning hitting sand fuses a glass root down into it (a fulgurite)
  let x = cx;
  for (let y = cy; y < H && y < cy + 25; y++) {
    if (Math.random() < 0.4) x += Math.random() < 0.5 ? -1 : 1;
    if (x < 0 || x >= W) break;
    const i = y * W + x;
    if (type[i] === SAND) make(i, GLASS);
    else if (type[i] !== GLASS) break;
  }
}

// ---------- Critters ----------
// Little walkers that live on top of the grid. A critter is 3 cells wide and
// 4 tall; (x, y) is the cell of its middle foot.
const critters = [];
const SOLID = new Uint8Array(16);
for (const t of [WALL, SAND, STONE, GUNPOWDER, PLANT, ICE, GLASS]) SOLID[t] = 1;
const LIQUID = new Uint8Array(16);
for (const t of [WATER, OIL, ACID, LAVA]) LIQUID[t] = 1;

function cellAt(x, y) { return x < 0 || x >= W || y >= H ? WALL : y < 0 ? EMPTY : type[y * W + x]; }
function solid(x, y) { return SOLID[cellAt(x, y)] === 1; }

function bodyClear(x, y) {
  for (let dy = 0; dy < 4; dy++) for (let dx = -1; dx <= 1; dx++) if (solid(x + dx, y - dy)) return false;
  return true;
}

function spawnCritter(x, y) {
  if (critters.length >= 40) critters.shift();
  critters.push({ x: Math.max(1, Math.min(W - 2, x | 0)), y: Math.max(3, Math.min(H - 1, y | 0)),
    dir: Math.random() < 0.5 ? -1 : 1, vy: 0, scared: 0, walk: 0, munch: 0, hue: (Math.random() * 360) | 0 });
  squeaks++;
}

function critterAt(x, y) { return critters.some(c => x >= c.x - 1 && x <= c.x + 1 && y >= c.y - 3 && y <= c.y); }

function killCrittersNear(x, y, r) {
  for (const c of critters) if (Math.abs(c.x - x) <= r + 1 && y >= c.y - 3 - r && y <= c.y + r) c.dead = 'zap';
}

function isHot(t) { return t === FIRE || t === LAVA; }

function updateCritter(c) {
  for (let dy = 0; dy < 4; dy++) for (let dx = -1; dx <= 1; dx++) {
    const t = cellAt(c.x + dx, c.y - dy);
    if (isHot(t)) { c.dead = 'burn'; return; }
    if (t === ACID) { c.dead = 'acid'; return; }
  }

  // Buried under sand: wriggle up out of it
  if (!bodyClear(c.x, c.y)) { c.y = Math.max(3, c.y - 1); return; }

  const swimming = LIQUID[cellAt(c.x, c.y - 1)] === 1;
  const grounded = solid(c.x - 1, c.y + 1) || solid(c.x, c.y + 1) || solid(c.x + 1, c.y + 1);

  if (swimming) {
    c.vy = 0;
    if ((tick & 3) === 0 && bodyClear(c.x, c.y - 1)) c.y--; // float up
  } else if (!grounded) {
    c.vy = Math.min(c.vy + 0.25, 3);
    for (let k = 0; k < Math.max(1, c.vy | 0); k++) {
      if (solid(c.x - 1, c.y + 1) || solid(c.x, c.y + 1) || solid(c.x + 1, c.y + 1)) break;
      c.y++;
    }
    return;
  } else {
    c.vy = 0;
  }

  // Run away from fire and lava ahead
  if (c.scared > 0) c.scared--;
  else {
    for (let d = 2; d <= 14; d += 2) {
      const ax = c.x + c.dir * d;
      if (isHot(cellAt(ax, c.y - 1)) || isHot(cellAt(ax, c.y - 3)) || (d <= 4 && isHot(cellAt(ax, c.y + 1)))) {
        c.dir = -c.dir;
        c.scared = 45;
        break;
      }
    }
  }

  // Nibble plants in front instead of walking
  if (c.munch > 0) { c.munch--; return; }
  for (let dy = 0; dy < 4; dy++) {
    const ax = c.x + c.dir * 2, ay = c.y - dy;
    if (cellAt(ax, ay) === PLANT && Math.random() < 0.08) {
      make(ay * W + ax, EMPTY);
      c.munch = 8;
      return;
    }
  }

  const speed = c.scared ? 1 : swimming ? 5 : 3;
  if (++c.walk % speed !== 0) return;
  for (let h = 0; h <= 2; h++) {
    if (bodyClear(c.x + c.dir, c.y - h)) { c.x += c.dir; c.y -= h; return; }
  }
  c.dir = -c.dir;
}

function updateCritters() {
  for (const c of critters) if (!c.dead) updateCritter(c);
  for (let n = critters.length - 1; n >= 0; n--) {
    const c = critters[n];
    if (!c.dead) continue;
    for (let dy = 0; dy < 4; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = c.x + dx, y = c.y - dy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x;
      if (type[i] === EMPTY && Math.random() < 0.7) make(i, c.dead === 'acid' ? SMOKE : Math.random() < 0.5 ? FIRE : SMOKE);
    }
    squeaks++;
    critters.splice(n, 1);
  }
}

// ---------- Rendering ----------
// The simulation is drawn into small offscreen canvases, then scaled up onto the
// visible canvas. Hot elements are also drawn into a glow layer that is blurred
// and added on top, so fire and lava light up their surroundings.
const canvas = document.getElementById('c');
canvas.width = W * S; canvas.height = H * S;
const ctx = canvas.getContext('2d');

function offscreen() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H);
  return { c, g, img, px: new Uint32Array(img.data.buffer) };
}
const base = offscreen();
const glow = offscreen();
const px = base.px, gpx = glow.px;
const canGlow = typeof ctx.filter === 'string';

const BG = [11, 11, 18];
function rgb(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r;
  g = g < 0 ? 0 : g > 255 ? 255 : g;
  b = b < 0 ? 0 : b > 255 ? 255 : b;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}
function blend(c, a) {
  return rgb(BG[0] + (c[0] - BG[0]) * a, BG[1] + (c[1] - BG[1]) * a, BG[2] + (c[2] - BG[2]) * a);
}
const BG_PX = rgb(...BG);

let particles = 0;
let hovering = false;

function render() {
  particles = 0;
  for (let i = 0; i < W * H; i++) {
    const t = type[i];
    gpx[i] = 0;
    if (t === EMPTY) { px[i] = BG_PX; continue; }
    particles++;
    const v = (shade[i] / 255 - 0.5);
    switch (t) {
      case WALL:      px[i] = rgb(150 + v * 20, 150 + v * 20, 165 + v * 20); break;
      case SAND:      px[i] = rgb(230 + v * 30, 195 + v * 30, 110 + v * 30); break;
      case STONE:     px[i] = rgb(105 + v * 30, 105 + v * 30, 112 + v * 30); break;
      case GUNPOWDER: px[i] = rgb(70 + v * 50, 70 + v * 50, 76 + v * 50); break;
      case WATER:     px[i] = rgb(40 + v * 20, 110 + v * 30, 230 + v * 20); break;
      case ICE:       px[i] = rgb(175 + v * 30, 220 + v * 20, 252); break;
      case OIL:       px[i] = rgb(95 + v * 20, 62 + v * 15, 30 + v * 10); break;
      case PLANT:     px[i] = rgb(40 + v * 30, 170 + v * 50, 60 + v * 20); break;
      case GLASS:     px[i] = rgb(160 + v * 40, 210 + v * 30, 220 + v * 30); break;
      case ACID:
        px[i] = rgb(115 + v * 40, 240 + v * 15, 60);
        gpx[i] = rgb(40, 130, 20);
        break;
      case LAVA: {
        const f = Math.sin((shade[i] + tick * 3) * 0.08) * 30;
        px[i] = rgb(245, 90 + v * 50 + f, 20);
        gpx[i] = rgb(230, 70 + f, 10);
        break;
      }
      case FIRE: {
        const h = Math.min(life[i] / 40, 1);
        px[i] = rgb(220 + h * 35, 50 + h * 170 + v * 40, 10 + h * 60);
        gpx[i] = px[i];
        break;
      }
      case STEAM: px[i] = blend([200, 210, 230], 0.25 + Math.min(life[i] / 200, 1) * 0.45); break;
      case SMOKE: px[i] = blend([90, 90, 98], Math.min(life[i] / 60, 1) * 0.8); break;
    }
  }
  for (const b of bolts) for (const [x, y] of b.pts) gpx[y * W + x] = rgb(170, 190, 255);
  base.g.putImageData(base.img, 0, 0);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(base.c, 0, 0, W * S, H * S);

  if (canGlow) {
    glow.g.putImageData(glow.img, 0, 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.filter = 'blur(10px)';
    ctx.globalAlpha = 0.9;
    ctx.drawImage(glow.c, 0, 0, W * S, H * S);
    ctx.filter = 'blur(3px)';
    ctx.globalAlpha = 0.5;
    ctx.drawImage(glow.c, 0, 0, W * S, H * S);
    ctx.restore();
  }

  for (const c of critters) drawCritter(c);

  for (const b of bolts) {
    const a = (b.life / 12) * (Math.random() < 0.3 ? 0.4 : 1);
    ctx.fillStyle = `rgba(240,245,255,${a})`;
    for (const [x, y] of b.pts) ctx.fillRect(x * S - 1, y * S, S + 2, S);
    ctx.fillStyle = `rgba(190,205,255,${a * 0.6})`;
    for (const [x, y] of b.branches) ctx.fillRect(x * S, y * S, S, S);
  }

  if (flash > 0.02) {
    ctx.fillStyle = `rgba(210,220,255,${flash * 0.35})`;
    ctx.fillRect(0, 0, W * S, H * S);
  }

  if (hovering && tool < LIGHTNING) {
    ctx.beginPath();
    ctx.arc(curX * S, curY * S, Math.max(brush, 1) * S, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawCritter(c) {
  const x0 = (c.x - 1) * S, y0 = (c.y - 3) * S, w = 3 * S;
  const stride = (c.walk >> 1) & 1;
  // legs
  ctx.fillStyle = `hsl(${c.hue},55%,38%)`;
  ctx.fillRect(x0 + (stride ? 1 : 2), y0 + 3 * S, 2, S);
  ctx.fillRect(x0 + w - (stride ? 3 : 4), y0 + 3 * S, 2, S);
  // body, squashed a little while munching
  const squash = c.munch > 0 && (c.munch & 2) ? 1 : 0;
  ctx.fillStyle = `hsl(${c.hue},80%,65%)`;
  ctx.fillRect(x0, y0 + squash, w, 3 * S - squash);
  // eye looks the way it walks
  const ex = c.dir > 0 ? x0 + w - 4 : x0 + 1;
  ctx.fillStyle = '#fff';
  ctx.fillRect(ex, y0 + 1 + squash, 3, 3);
  ctx.fillStyle = '#111';
  ctx.fillRect(c.dir > 0 ? ex + 2 : ex, y0 + 2 + squash, 1, 2);
  if (c.scared) {
    ctx.fillStyle = '#ff5050';
    ctx.fillRect(x0 + S + 1, y0 - 10, 2, 5);
    ctx.fillRect(x0 + S + 1, y0 - 4, 2, 2);
  }
}

// ---------- Sound ----------
// Everything is synthesized from filtered white noise, so no audio files are needed
let audio = null, noiseBuf = null, muted = false;
let lastBoom = 0, lastSizzle = 0;

function initAudio() {
  if (audio) return;
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { audio = null; }
}

function noise(dur, filterType, freq, vol) {
  const now = audio.currentTime;
  const src = audio.createBufferSource();
  src.buffer = noiseBuf;
  const f = audio.createBiquadFilter();
  f.type = filterType; f.frequency.value = freq;
  const g = audio.createGain();
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  src.connect(f).connect(g).connect(audio.destination);
  src.start(now, Math.random());
  src.stop(now + dur);
}

function playBoom(strength) {
  const now = audio.currentTime;
  noise(1.2, 'lowpass', 500, Math.min(0.5 + strength * 0.1, 1));
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.frequency.setValueAtTime(90, now);
  o.frequency.exponentialRampToValueAtTime(30, now + 0.6);
  g.gain.setValueAtTime(0.8, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
  o.connect(g).connect(audio.destination);
  o.start(now); o.stop(now + 0.7);
}

function playThunder() {
  noise(0.25, 'highpass', 1500, 0.5);
  noise(2.5, 'lowpass', 180, 1);
}

function playSqueak() {
  const now = audio.currentTime;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(900, now);
  o.frequency.exponentialRampToValueAtTime(1800, now + 0.12);
  g.gain.setValueAtTime(0.2, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  o.connect(g).connect(audio.destination);
  o.start(now); o.stop(now + 0.15);
}

function playSounds() {
  const now = performance.now();
  if (audio && !muted) {
    if (thunders > 0) playThunder();
    if (squeaks > 0) playSqueak();
    if (booms > 0 && now - lastBoom > 90) { playBoom(booms); lastBoom = now; booms = 0; }
    if (sizzles > 0 && now - lastSizzle > 120) {
      noise(0.18, 'highpass', 3500, Math.min(0.03 + sizzles * 0.004, 0.18));
      lastSizzle = now; sizzles = 0;
    }
  }
  thunders = 0; squeaks = 0;
  // Don't let events pile up into one giant sound later
  if (now - lastBoom > 300) booms = 0;
  if (now - lastSizzle > 300) sizzles = 0;
}

// ---------- Input ----------
let tool = SAND;
let brush = 4;
let paused = false;
let drawing = false, erasing = false;
let lastX = 0, lastY = 0, curX = 0, curY = 0;

const toolbar = document.getElementById('toolbar');
TOOLS.forEach((tl, n) => {
  const b = document.createElement('div');
  b.className = 'tool' + (tl.t === tool ? ' active' : '');
  b.innerHTML = `<span class="swatch" style="background:${tl.color};${tl.t === EMPTY ? 'box-shadow:inset 0 0 0 1px #555' : ''}"></span>${tl.name}<span class="key">${tl.key}</span>`;
  b.onclick = () => selectTool(n);
  tl.el = b;
  toolbar.appendChild(b);
});
function selectTool(n) {
  tool = TOOLS[n].t;
  TOOLS.forEach((tl, k) => tl.el.classList.toggle('active', k === n));
}

const brushInput = document.getElementById('brush');
brushInput.oninput = () => brush = +brushInput.value;

const pauseBtn = document.getElementById('pause');
function togglePause() { paused = !paused; pauseBtn.textContent = paused ? 'Play (Space)' : 'Pause (Space)'; }
pauseBtn.onclick = togglePause;

const muteBtn = document.getElementById('mute');
function toggleMute() { muted = !muted; muteBtn.textContent = muted ? 'Sound off (M)' : 'Sound on (M)'; }
muteBtn.onclick = toggleMute;

function clearAll() { type.fill(0); life.fill(0); critters.length = 0; bolts.length = 0; }
document.getElementById('clear').onclick = clearAll;

const windInput = document.getElementById('wind');
const windLabel = document.getElementById('windLabel');
function setWind(v) {
  v = Math.max(-100, Math.min(100, v));
  windInput.value = v;
  wind = (v / 100) * 0.8;
  windLabel.textContent = v === 0 ? 'calm' : (v < 0 ? '← ' : '→ ') + Math.abs(v) + '%';
}
windInput.oninput = () => setWind(+windInput.value);
windInput.ondblclick = () => setWind(0);

const hint = document.getElementById('hint');
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

// ---------- Share as link ----------
// The whole grid of element ids is deflate-compressed and stored in the URL hash,
// so a link reproduces the world with no server involved.
async function shareWorld() {
  let url;
  try {
    const stream = new Blob([type]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    const code = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    url = location.origin + location.pathname + '#w=' + code;
    history.replaceState(null, '', url);
  } catch (e) {
    toast('Sharing is not supported in this browser');
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    toast('Link copied! Anyone who opens it gets your world.');
  } catch (e) {
    toast('Copy the link from the address bar');
  }
}
document.getElementById('share').onclick = shareWorld;

async function loadFromHash() {
  const m = location.hash.match(/^#w=([\w-]+)$/);
  if (!m) return;
  try {
    let b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const data = new Uint8Array(await new Response(stream).arrayBuffer());
    if (data.length !== W * H) throw new Error('wrong size');
    for (let i = 0; i < W * H; i++) {
      const t = data[i] <= GLASS ? data[i] : EMPTY;
      if (t) make(i, t); else type[i] = EMPTY;
    }
    hint.classList.add('gone');
    toast('Loaded a shared world');
  } catch (e) {
    toast("Couldn't load that link");
  }
}

function toGrid(e) {
  const r = canvas.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
}

canvas.addEventListener('pointerdown', e => {
  initAudio();
  if (audio && audio.state === 'suspended') audio.resume();
  canvas.setPointerCapture(e.pointerId);
  erasing = e.button === 2;
  [curX, curY] = toGrid(e);
  lastX = curX; lastY = curY;
  hint.classList.add('gone');
  // Lightning and critters act once per click instead of painting
  if (!erasing && tool === LIGHTNING) { strike(curX); return; }
  if (!erasing && tool === CRITTER) { spawnCritter(curX, curY); return; }
  drawing = true;
});
canvas.addEventListener('pointermove', e => {
  [curX, curY] = toGrid(e);
  hovering = e.pointerType === 'mouse';
});
canvas.addEventListener('pointerleave', () => hovering = false);
canvas.addEventListener('pointerup', () => drawing = false);
canvas.addEventListener('pointercancel', () => drawing = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const n = TOOLS.findIndex(tl => tl.key === k);
  if (n >= 0) selectTool(n);
  else if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'c') clearAll();
  else if (k === 'm') toggleMute();
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setWind(+windInput.value - 20); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setWind(+windInput.value + 20); }
  else if (k === '[') { brush = Math.max(1, brush - 1); brushInput.value = brush; }
  else if (k === ']') { brush = Math.min(15, brush + 1); brushInput.value = brush; }
});

function paintAt(cx, cy) {
  const t = erasing ? EMPTY : tool;
  const solid = t === WALL || t === PLANT || t === ICE || t === EMPTY;
  const chance = solid ? 1 : t === FIRE ? 0.5 : 0.35;
  const r = brush;
  for (let dy = -r; dy <= r; dy++) {
    for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = (cx + dx) | 0, y = (cy + dy) | 0;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x;
      if (t === EMPTY) { type[i] = EMPTY; continue; }
      if (type[i] !== EMPTY) continue;
      if (Math.random() < chance) make(i, t);
    }
  }
}

function paintStroke() {
  // Interpolate between frames so fast strokes leave no gaps; holding still keeps pouring
  const dist = Math.hypot(curX - lastX, curY - lastY);
  const steps = Math.max(1, Math.ceil(dist / Math.max(1, brush / 2)));
  for (let s = 1; s <= steps; s++) {
    paintAt(lastX + (curX - lastX) * s / steps, lastY + (curY - lastY) * s / steps);
  }
  lastX = curX; lastY = curY;
}

// ---------- Main loop ----------
const countEl = document.getElementById('count');
let frame = 0;
function loop() {
  if (drawing) paintStroke();
  if (!paused) { step(); updateCritters(); }
  render();
  playSounds();
  for (let n = bolts.length - 1; n >= 0; n--) if (--bolts[n].life <= 0) bolts.splice(n, 1);
  flash *= 0.8;

  if (shake > 0.3) {
    canvas.style.transform = `translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)`;
    shake *= 0.85;
  } else if (shake) {
    shake = 0;
    canvas.style.transform = '';
  }

  if (++frame % 15 === 0) {
    countEl.textContent = particles.toLocaleString() + ' particles' +
      (critters.length ? ` · ${critters.length} critter${critters.length > 1 ? 's' : ''}` : '');
  }
  requestAnimationFrame(loop);
}
loadFromHash();
loop();
</script>
</body>
</html>
